<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:ital,wght@0,400;0,450;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
(function () {
  var CLAVE = "ruta780:hechas";

  function leer() {
    try { return new Set(JSON.parse(localStorage.getItem(CLAVE) || "[]")); }
    catch (e) { return new Set(); }
  }
  function guardar(conjunto) {
    try { localStorage.setItem(CLAVE, JSON.stringify(Array.from(conjunto))); }
    catch (e) { /* modo privado: el progreso no persiste, la página sigue funcionando */ }
  }
  function alternar(id, encendido) {
    var h = leer();
    encendido ? h.add(id) : h.delete(id);
    guardar(h);
    pintar();
  }

  function pintar() {
    var hechas = leer();

    // filas de ruta (páginas de módulo)
    document.querySelectorAll(".ruta .fila[data-leccion]").forEach(function (fila) {
      var chk = fila.querySelector(".check");
      if (chk && !chk.disabled) chk.checked = hechas.has(fila.dataset.leccion);
    });

    // barras de progreso: data-ids = publicadas, data-total = planeadas
    document.querySelectorAll("[data-progreso]").forEach(function (caja) {
      var ids = (caja.dataset.ids || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      var total = parseInt(caja.dataset.total || String(ids.length), 10);
      var listas = ids.filter(function (id) { return hechas.has(id); }).length;
      var pct = ids.length ? (listas / ids.length) * 100 : 0;

      var relleno = caja.querySelector(".barra > i");
      if (relleno) relleno.style.width = pct.toFixed(1) + "%";

      var txt = caja.querySelector(".progreso-txt");
      if (txt) {
        txt.textContent = ids.length
          ? listas + " de " + ids.length + " publicadas · " + total + " planeadas"
          : total + " lecciones planeadas";
      }
    });

    // control de la propia lección
    var ctrl = document.querySelector(".completar");
    if (ctrl) {
      var marcada = hechas.has(ctrl.dataset.leccion);
      ctrl.classList.toggle("hecha", marcada);
      var c = ctrl.querySelector("input");
      if (c) c.checked = marcada;
      var e = ctrl.querySelector("span");
      if (e) e.textContent = marcada ? "Lección completada" : "Marcar como completada";
    }
  }

  function montar() {
    // checkboxes de las rutas
    document.querySelectorAll(".ruta .fila[data-leccion] .check").forEach(function (chk) {
      if (chk.disabled) return;
      chk.addEventListener("change", function () {
        alternar(chk.closest(".fila").dataset.leccion, chk.checked);
      });
    });

    // en una lección: inyectar el control al final del contenido
    var meta = document.querySelector(".meta-leccion[data-leccion]");
    var main = document.querySelector("main");
    if (meta && main) {
      var id = meta.dataset.leccion;
      var ctrl = document.createElement("label");
      ctrl.className = "completar";
      ctrl.dataset.leccion = id;
      ctrl.innerHTML = '<input type="checkbox"><span>Marcar como completada</span>';
      ctrl.querySelector("input").addEventListener("change", function (ev) {
        alternar(id, ev.target.checked);
      });
      main.appendChild(ctrl);
    }

    pintar();
  }

  document.readyState === "loading"
    ? document.addEventListener("DOMContentLoaded", montar)
    : montar();

  // otra pestaña cambió el progreso
  window.addEventListener("storage", function (e) { if (e.key === CLAVE) pintar(); });
})();
</script>

<script>
(function () {
  function listo(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }
  var NS = "http://www.w3.org/2000/svg";

  function flecha() {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 16 16");
    s.setAttribute("width", "11"); s.setAttribute("height", "11");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7");
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", "M3 8h9M8.5 4.5 12 8l-3.5 3.5");
    s.appendChild(p);
    var w = document.createElement("span");
    w.className = "mod-flecha"; w.setAttribute("aria-hidden", "true");
    w.appendChild(s);
    return w;
  }

  listo(function () {
    // En la portada el hero hace de encabezado: el bloque de título de Quarto sobra.
    if (document.querySelector(".hero-r780")) document.body.classList.add("portada");

    document.querySelectorAll(".indice-modulos .mod-fila").forEach(function (f) {
      if (!f.querySelector(".mod-flecha")) f.appendChild(flecha());
    });

    // Entrada escalonada al viewport. Las clases se ponen desde JS:
    // sin JS, o sin IntersectionObserver, el contenido queda visible.
    if (!("IntersectionObserver" in window)) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    // Solo el hero, que siempre está en pantalla al cargar. Las listas de
    // módulos y lecciones NO se animan: si el observer no dispara (pestaña en
    // segundo plano, por ejemplo) el contenido quedaría invisible, y esas
    // listas son la navegación del sitio.
    var piezas = document.querySelectorAll(".hero-r780 > *");
    if (!piezas.length) return;

    function revelar(el) { el.classList.add("rv-on"); }

    var io = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (!e.isIntersecting) return;
        revelar(e.target);
        io.unobserve(e.target);
      });
    }, { threshold: 0.02 });

    piezas.forEach(function (el, i) {
      el.classList.add("rv");
      el.style.setProperty("--rv-i", i % 8);
      io.observe(el);
    });

    // Red de seguridad: pase lo que pase, nada sigue oculto pasados 1.6 s.
    setTimeout(function () {
      document.querySelectorAll(".rv:not(.rv-on)").forEach(revelar);
    }, 1600);
  });
})();
</script>
