<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:ital,wght@0,400;0,450;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="/glosario/glosario.js"></script>
<script>
(function () {
  var CLAVE = "ruta780:hechas";

  function leer() {
    try { return new Set(JSON.parse(localStorage.getItem(CLAVE) || "[]")); }
    catch (e) { return new Set(); }
  }
  function guardar(conjunto) {
    try { localStorage.setItem(CLAVE, JSON.stringify(Array.from(conjunto))); }
    catch (e) { /* modo privado: el progreso no persiste, la página sigue funcionando */ }
  }
  function alternar(id, encendido) {
    var h = leer();
    encendido ? h.add(id) : h.delete(id);
    guardar(h);
    pintar();
  }

  function pintar() {
    var hechas = leer();

    // filas de ruta (páginas de módulo)
    document.querySelectorAll(".ruta .fila[data-leccion]").forEach(function (fila) {
      var chk = fila.querySelector(".check");
      if (chk && !chk.disabled) chk.checked = hechas.has(fila.dataset.leccion);
    });

    // barras de progreso: data-ids = publicadas, data-total = planeadas
    document.querySelectorAll("[data-progreso]").forEach(function (caja) {
      var ids = (caja.dataset.ids || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      var total = parseInt(caja.dataset.total || String(ids.length), 10);
      var listas = ids.filter(function (id) { return hechas.has(id); }).length;
      var pct = ids.length ? (listas / ids.length) * 100 : 0;

      var relleno = caja.querySelector(".barra > i");
      if (relleno) relleno.style.width = pct.toFixed(1) + "%";

      var txt = caja.querySelector(".progreso-txt");
      if (txt) {
        txt.textContent = ids.length
          ? listas + " de " + ids.length + " publicadas · " + total + " planeadas"
          : total + " lecciones planeadas";
      }
    });

    // control de la propia lección
    var ctrl = document.querySelector(".completar");
    if (ctrl) {
      var marcada = hechas.has(ctrl.dataset.leccion);
      ctrl.classList.toggle("hecha", marcada);
      var c = ctrl.querySelector("input");
      if (c) c.checked = marcada;
      var e = ctrl.querySelector("span");
      if (e) e.textContent = marcada ? "Lección completada" : "Marcar como completada";
    }
  }

  function montar() {
    // checkboxes de las rutas
    document.querySelectorAll(".ruta .fila[data-leccion] .check").forEach(function (chk) {
      if (chk.disabled) return;
      chk.addEventListener("change", function () {
        alternar(chk.closest(".fila").dataset.leccion, chk.checked);
      });
    });

    // en una lección: inyectar el control al final del contenido
    var meta = document.querySelector(".meta-leccion[data-leccion]");
    var main = document.querySelector("main");
    if (meta && main) {
      var id = meta.dataset.leccion;
      var ctrl = document.createElement("label");
      ctrl.className = "completar";
      ctrl.dataset.leccion = id;
      ctrl.innerHTML = '<input type="checkbox"><span>Marcar como completada</span>';
      ctrl.querySelector("input").addEventListener("change", function (ev) {
        alternar(id, ev.target.checked);
      });
      main.appendChild(ctrl);
    }

    pintar();
  }

  document.readyState === "loading"
    ? document.addEventListener("DOMContentLoaded", montar)
    : montar();

  // otra pestaña cambió el progreso
  window.addEventListener("storage", function (e) { if (e.key === CLAVE) pintar(); });
})();
</script>

<script>
(function () {
  function listo(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }
  var NS = "http://www.w3.org/2000/svg";

  function flecha() {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 16 16");
    s.setAttribute("width", "11"); s.setAttribute("height", "11");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", "1.7");
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    var p = document.createElementNS(NS, "path");
    p.setAttribute("d", "M3 8h9M8.5 4.5 12 8l-3.5 3.5");
    s.appendChild(p);
    var w = document.createElement("span");
    w.className = "mod-flecha"; w.setAttribute("aria-hidden", "true");
    w.appendChild(s);
    return w;
  }

  listo(function () {
    // En la portada el hero hace de encabezado: el bloque de título de Quarto sobra.
    if (document.querySelector(".hero-r780")) document.body.classList.add("portada");

    document.querySelectorAll(".indice-modulos .mod-fila").forEach(function (f) {
      if (!f.querySelector(".mod-flecha")) f.appendChild(flecha());
    });
  });
})();
</script>

<script>
// Tooltips de glosario. Un término se marca en el markdown como [esperanza]{.g}
// (o [varianzas]{.g data-t="varianza"} si la forma flexionada no es la clave).
(function () {
  function listo(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }
  function clave(s) {
    return s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  }
  listo(function () {
    var G = window.GLOSARIO || {};
    var marcas = document.querySelectorAll("span.g");

    var tip = document.createElement("div");
    tip.className = "g-tip"; tip.setAttribute("role", "tooltip"); tip.id = "g-tip";
    tip.hidden = true;
    document.body.appendChild(tip);
    var abierto = null;

    function mostrar(el, entrada) {
      var e = entrada;
      if (!e) {
        var k = el.dataset.t ? clave(el.dataset.t) : clave(el.textContent);
        e = G[k];
      }
      if (!e) return;
      tip.innerHTML =
        '<span class="g-t">' + e.t + (e.s ? ' <span class="g-s">' + e.s + '</span>' : '') + '</span>' +
        '<span class="g-d">' + e.d + '</span>' +
        (e.l ? '<a class="g-l" href="/ruta780/' + e.l + '.html">se introduce en ' + e.l.split("/")[0] + ' ' + e.l.split("/")[1].slice(0, 2) + ' →</a>' : '');
      cancelarCierre();
      tip.hidden = false;
      var r = el.getBoundingClientRect(), tw = Math.min(340, window.innerWidth - 24);
      tip.style.width = tw + "px";
      var x = Math.max(12, Math.min(r.left, window.innerWidth - tw - 12));
      var arriba = r.top > window.innerHeight * 0.6;
      tip.style.left = (x + window.scrollX) + "px";
      tip.style.top = (arriba ? r.top + window.scrollY - tip.offsetHeight - 8 : r.bottom + window.scrollY + 8) + "px";
      el.setAttribute("aria-describedby", "g-tip");
      abierto = el;
    }
    // Cerrar con retardo: si no, al mover el raton hacia el tooltip se cierra
    // antes de llegar y su enlace es inalcanzable.
    var cierre = null;
    function cancelarCierre() { if (cierre) { clearTimeout(cierre); cierre = null; } }
    function ocultarYa() {
      cancelarCierre();
      if (!abierto) return;
      abierto.removeAttribute("aria-describedby");
      tip.hidden = true; abierto = null;
    }
    function ocultar() {
      cancelarCierre();
      cierre = setTimeout(ocultarYa, 220);
    }
    tip.addEventListener("mouseenter", cancelarCierre);
    tip.addEventListener("mouseleave", ocultar);

    marcas.forEach(function (el) {
      var k = el.dataset.t ? clave(el.dataset.t) : clave(el.textContent);
      if (!G[k]) return;                       // sin entrada: se queda como texto normal
      el.classList.add("g-on");
      el.setAttribute("tabindex", "0");
      el.addEventListener("mouseenter", function () { mostrar(el); });
      el.addEventListener("mouseleave", ocultar);
      el.addEventListener("focus", function () { mostrar(el); });
      el.addEventListener("blur", ocultar);
      el.addEventListener("click", function (ev) {   // táctil: toca para abrir/cerrar
        ev.preventDefault();
        abierto === el ? ocultarYa() : mostrar(el);
      });
    });
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") ocultarYa(); });
    document.addEventListener("click", function (ev) {
      if (abierto && !abierto.contains(ev.target) && !tip.contains(ev.target)) ocultarYa();
    });

    // ── símbolos dentro de las fórmulas ──
    // KaTeX dibuja cada símbolo en su propio <span>. Se recorre solo .katex-html
    // (la rama .katex-mathml es para lectores de pantalla y duplicaría el texto),
    // se marcan las hojas cuyo texto es exactamente un símbolo del glosario, y se
    // escucha con delegación en vez de un listener por span.
    var S = window.GLOSARIO_SIMBOLOS || {};
    if (Object.keys(S).length) {
      var ALIAS = { "∑": "Σ", "⊤": "ᵀ", "⋅": "·" };

      function marcarSimbolos() {
        document.querySelectorAll(".katex-html span:not(.g-sim)").forEach(function (sp) {
          if (sp.children.length) return;                // solo hojas
          var txt = sp.textContent.trim();
          if (!txt || txt.length > 3) return;
          var k = ALIAS[txt] || txt;
          if (!S[k] && sp.classList.contains("mathbb") && txt === "R") k = "ℝ";
          if (!S[k]) return;
          sp.classList.add("g-sim");
          sp.dataset.sim = k;
          sp.setAttribute("tabindex", "0");
        });
      }

      // KaTeX renderiza despues de DOMContentLoaded, asi que no basta una pasada:
      // se reintenta hasta que aparezcan formulas, y se vuelve a pasar en load por
      // si alguna se renderizo tarde.
      var intentos = 0;
      (function esperarKatex() {
        if (document.querySelector(".katex-html")) { marcarSimbolos(); return; }
        if (++intentos < 40) setTimeout(esperarKatex, 150);
      })();
      window.addEventListener("load", function () { setTimeout(marcarSimbolos, 300); });

      function entradaDe(el) { return S[el.dataset.sim]; }
      document.addEventListener("mouseover", function (ev) {
        var el = ev.target.closest && ev.target.closest(".g-sim");
        if (el && el !== abierto) mostrar(el, entradaDe(el));
      });
      document.addEventListener("mouseout", function (ev) {
        var el = ev.target.closest && ev.target.closest(".g-sim");
        if (el && el === abierto) ocultar();
      });
      document.addEventListener("focusin", function (ev) {
        var el = ev.target.closest && ev.target.closest(".g-sim");
        if (el) mostrar(el, entradaDe(el));
      });
      document.addEventListener("focusout", function (ev) {
        var el = ev.target.closest && ev.target.closest(".g-sim");
        if (el && el === abierto) ocultar();
      });
      document.addEventListener("click", function (ev) {
        var el = ev.target.closest && ev.target.closest(".g-sim");
        if (!el) return;
        ev.preventDefault();
        abierto === el ? ocultarYa() : mostrar(el, entradaDe(el));
      });
    }
  });
})();
</script>

<script>
// El sidebar es uno solo, compartido por todos los modulos (no una lista de
// sidebars por seccion), asi que Quarto no puede deducir de ahi que pestana
// del navbar corresponde a la pagina actual: en todo el sitio marca "Python"
// como activa, sin importar donde se este. Se recalcula aqui por la ruta real.
(function () {
  function corregirNavActivo() {
    var enlaces = document.querySelectorAll("#quarto-header .navbar-nav .nav-link");
    if (!enlaces.length) return;
    var ruta = location.pathname;
    var mejor = null, mejorLargo = -1;
    enlaces.forEach(function (a) {
      a.classList.remove("active");
      a.removeAttribute("aria-current");
      var href = a.getAttribute("href");
      if (!href) return;
      var base = new URL(href, location.href).pathname;
      if (ruta.indexOf(base) === 0 && base.length > mejorLargo) {
        mejor = a;
        mejorLargo = base.length;
      }
    });
    if (mejor) {
      mejor.classList.add("active");
      mejor.setAttribute("aria-current", "page");
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", corregirNavActivo);
  } else {
    corregirNavActivo();
  }
})();
</script>
