project:
  type: website
  output-dir: _site
  resources:
    - glosario/glosario.js
  render:
    - "*.qmd"
    - "matematica/*.qmd"
    - "estadistica/*.qmd"
    - "python/*.qmd"
    - "ml/*.qmd"
    - "causal/*.qmd"
    - "series/*.qmd"
    - "proyectos/*.qmd"
    - "grafo/*.qmd"
    - "glosario/*.qmd"
    - "!brain/"
    - "!_templates/"

website:
