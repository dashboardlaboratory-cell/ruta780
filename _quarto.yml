project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "matematica/*.qmd"
    - "estadistica/*.qmd"
    - "python/*.qmd"
    - "ml/*.qmd"
    - "causal/*.qmd"
    - "series/*.qmd"
    - "proyectos/*.qmd"
    - "grafo/*.qmd"
    - "!brain/"
    - "!_templates/"

website:
  title: "Ruta 780"
  description: "Plataforma de aprendizaje: Python, matemática y machine learning"
  search:
    location: navbar
    type: overlay
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Inicio
      - href: python/index.qmd
        text: Python
      - href: matematica/index.qmd
        text: Matemática
      - href: estadistica/index.qmd
        text: Estadística
      - href: series/index.qmd
        text: Series
      - href: ml/index.qmd
        text: ML
      - href: causal/index.qmd
        text: Causal
    right:
      - href: proyectos/index.qmd
        text: Proyectos
      - href: grafo/index.qmd
        text: Grafo
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - section: "Python"
        contents:
          - text: "Mapa del módulo"
            href: python/index.qmd
          - python/01-tipos-y-estructuras.qmd
          - python/02-funciones-y-scope.qmd
          - python/03-comprehensions.qmd
          - python/04-archivos-y-errores.qmd
          - python/05-entorno-uv-git.qmd
          - python/06-numpy-primer-contacto.qmd
      - section: "Matemática"
        contents:
          - text: "Mapa del módulo"
            href: matematica/index.qmd
          - matematica/01-vectores-y-espacios.qmd
          - matematica/02-matriz-como-transformacion.qmd
          - text: "Cómo se animan los visuales"
            href: matematica/demo-visuales.qmd
      - section: "Estadística"
        contents:
          - text: "Mapa del módulo"
            href: estadistica/index.qmd
          - estadistica/01-variables-aleatorias.qmd
      - section: "Series de tiempo"
        contents:
          - text: "Mapa del módulo"
            href: series/index.qmd
      - section: "Machine Learning"
        contents:
          - text: "Mapa del módulo"
            href: ml/index.qmd
      - section: "Inferencia causal"
        contents:
          - text: "Mapa del módulo"
            href: causal/index.qmd
  page-footer:
    center: "Ruta 780 · 860 h · 86 semanas"

format:
  live-html:
    theme: [cosmo, custom.scss]
    include-in-header: encabezado.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    html-math-method: katex
    live:
      show-solutions: true
      show-hints: true

engine: markdown
