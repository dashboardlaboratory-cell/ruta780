project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "matematica/*.qmd"
    - "estadistica/*.qmd"
    - "python/*.qmd"
    - "ml/*.qmd"
    - "causal/*.qmd"
    - "proyectos/*.qmd"
    - "grafo/*.qmd"
    - "!brain/"
    - "!_templates/"

website:
  title: "Ruta 780"
  description: "Plataforma de aprendizaje: Python, matemática y machine learning"
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Inicio
      - href: python/index.qmd
        text: Python
      - href: matematica/index.qmd
        text: Matemática
      - href: estadistica/index.qmd
        text: Estadística
      - href: ml/index.qmd
        text: ML
      - href: causal/index.qmd
        text: Causal
    right:
      - href: proyectos/index.qmd
        text: Proyectos
      - href: grafo/index.qmd
        text: Grafo
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - section: "Python"
        contents:
          - python/index.qmd
          - python/01-tipos-y-estructuras.qmd
          - python/02-funciones-y-scope.qmd
          - python/03-comprehensions.qmd
          - python/04-archivos-y-errores.qmd
          - python/05-entorno-uv-git.qmd
          - python/06-numpy-primer-contacto.qmd
      - section: "Matemática"
        contents:
          - matematica/index.qmd
          - matematica/demo-visuales.qmd
      - section: "Estadística"
        contents:
          - estadistica/index.qmd
      - section: "Machine Learning"
        contents:
          - ml/index.qmd
      - section: "Inferencia causal"
        contents:
          - causal/index.qmd
  page-footer:
    center: "Ruta 780 · 780 h · 78 semanas"

format:
  live-html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    html-math-method: katex

engine: markdown

live:
  show-solutions: true
  show-hints: true
