name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python + NumPy para el verificador
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar NumPy
        run: python3 -m pip install --quiet numpy

      # Corre el Python de cada leccion y comprueba que los numeros que la
      # prosa afirma siguen saliendo. Si uno deja de cuadrar, el build muere
      # aqui y la pagina no se publica con un dato mal.
      - name: Verificar las salidas numericas de las lecciones
        run: python3 verificar/salidas.py

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar extension quarto-live
        run: quarto add r-wasm/quarto-live --no-prompt

      - name: Generar grafo de conocimiento
        run: python3 grafo/build_graph.py

      - name: Render
        run: quarto render

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
